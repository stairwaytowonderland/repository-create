name: CI

on:
  push:
    # Fires when a tag matching v* is pushed with personal credentials.
    tags: ['v*']
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: '${{ github.repository_id }}-${{ github.ref_name }}'
  cancel-in-progress: true

# Use PAT instead of GITHUB_TOKEN to cause semantic-release to trigger tag pipeline when tag is created.
# 'Fine-grained token' repo permissions: Contents

jobs:
  release:
    name: Release
    if: startsWith(github.ref, 'refs/heads/main')
    uses: ./.github/workflows/release.yaml
    secrets: inherit
    with:
      # dispatch-workflow: publish.yaml
      fail-on-no-release: true

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish.yaml
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}\

  normalize-majorver:
    name: Normalize Major Version Tag
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Normalize Major Version Tag
        uses: stairwaytowonderland/normalize-majorver@v1
